<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Formiga - Recuperação de Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-wrapper">
        <div class="auth-card card-solid">
            <img src="img/cupcake.png" alt="Maria Formiga Logo" class="brand-logo">
            <h1>Recuperação de Senha</h1>
            <p class="subtitle">Enviaremos instruções de acesso seguras para o seu e-mail corporativo.</p>

            <form action="index.html" method="GET">
                <div class="input-group">
                    <label for="email">E-mail cadastrado</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="nome@mariaformiga.com" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Enviar link de recuperação</button>
            </form>

            <a href="index.html" class="link-back">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Login
            </a>
        </div>
    </main>

</body>
</html>
