<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D96B84" />
    <link rel="icon" href="../assets/img/cupcake.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../CSS/global.css" />
    <link rel="stylesheet" href="../CSS/recuperacao.css" />
    <title>Maria Formiga — Recuperação de Senha</title>
  </head>
  <body data-page="recuperacao">
    <main class="auth-wrapper">
      <div class="auth-card card-solid">
        <img
          src="../assets/img/cupcake.png"
          alt="Maria Formiga"
          class="brand-logo"
          width="64"
          height="64"
        />
        <h1 id="recoveryTitle">Recuperação de Senha</h1>
        <p class="subtitle" id="recoveryDescription">
          Informe o e-mail cadastrado para recuperar seu acesso.
        </p>

        <form id="recoveryForm">
          <div class="input-group">
            <label for="recoveryEmail">E-mail cadastrado *</label
            ><input
              id="recoveryEmail"
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="120"
            />
          </div>
          <button type="submit" class="btn-primary">Continuar</button>
        </form>
        <!-- Etapa visual de verificação: qualquer combinação de seis números permite continuar. -->
        <form id="verificationForm" hidden>
          <fieldset class="verification-fieldset">
            <legend>Código de verificação</legend>
            <div
              class="verification-digits"
              role="group"
              aria-label="Código de seis dígitos"
            >
              <input
                class="code-digit"
                id="codeDigit1"
                name="codeDigit1"
                type="text"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                autocomplete="one-time-code"
                required
                aria-label="Dígito 1 de 6"
              />
              <input
                class="code-digit"
                id="codeDigit2"
                name="codeDigit2"
                type="text"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                autocomplete="off"
                required
                aria-label="Dígito 2 de 6"
              />
              <input
                class="code-digit"
                id="codeDigit3"
                name="codeDigit3"
                type="text"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                autocomplete="off"
                required
                aria-label="Dígito 3 de 6"
              />
              <input
                class="code-digit"
                id="codeDigit4"
                name="codeDigit4"
                type="text"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                autocomplete="off"
                required
                aria-label="Dígito 4 de 6"
              />
              <input
                class="code-digit"
                id="codeDigit5"
                name="codeDigit5"
                type="text"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                autocomplete="off"
                required
                aria-label="Dígito 5 de 6"
              />
              <input
                class="code-digit"
                id="codeDigit6"
                name="codeDigit6"
                type="text"
                inputmode="numeric"
                pattern="[0-9]"
                maxlength="1"
                autocomplete="off"
                required
                aria-label="Dígito 6 de 6"
              />
            </div>
          </fieldset>
          <button type="submit" class="btn-primary" id="btnVerifyCode">
            Continuar
          </button>
          <button
            type="button"
            class="link-back verification-back"
            id="btnChangeEmail"
          >
            Alterar e-mail
          </button>
        </form>
        <a class="link-back" href="index.html">Voltar ao login</a>
      </div>
    </main>
    <div
      id="notifications"
      class="notifications"
      role="status"
      aria-live="polite"
    ></div>
    <script src="../js/recuperacao.js" defer></script>
    <script src="../js/global.js" defer></script>
  </body>
</html>
