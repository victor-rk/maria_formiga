<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria Formiga — Login</title>
    <meta name="theme-color" content="#D96B84" />
    <link rel="icon" href="../assets/img/cupcake.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../CSS/global.css" />
    <link rel="stylesheet" href="../CSS/auth.css" />
    <link rel="stylesheet" href="../CSS/index.css" />
  </head>
  <body data-page="index">
    <!-- Estrutura de autenticação: tela de login do sistema. -->
    <main class="auth-wrapper">
      <div class="auth-card card-solid">
        <img
          src="../assets/img/cupcake.png"
          alt="Logotipo Maria Formiga"
          class="brand-logo"
        />
        <h1>Entrar no Sistema</h1>

        <form id="loginForm" action="home.html" method="POST" novalidate>
          <div class="input-group">
            <label for="email">E-mail ou usuário</label>
            <div class="input-wrapper">
              <i
                class="fa-regular fa-envelope input-icon"
                aria-hidden="true"
              ></i>
              <input
                type="text"
                id="email"
                name="email"
                placeholder="E-mail"
                autocomplete="username"
                required
                aria-label="E-mail ou usuário"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Senha"
                autocomplete="current-password"
                required
                aria-label="Senha"
              />
              <button
                type="button"
                class="pwd-toggle"
                aria-label="Mostrar ou ocultar senha"
              >
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="login-options">
            <label class="checkbox-group">
              <input type="checkbox" name="remember" />
              Manter-me conectado
            </label>
            <a href="recuperacao.html" class="link-primary"
              >Esqueci minha senha</a
            >
          </div>

          <button type="submit" id="btnLogin" class="btn-primary">
            Entrar
          </button>
        </form>
      </div>
    </main>

    <div
      id="notifications"
      class="notifications"
      role="status"
      aria-live="polite"
    ></div>
    <script src="../js/index.js" defer></script>
    <script src="../js/configuracoes.js" defer></script>
    <script src="../js/global.js" defer></script>
    <script src="../js/runtime.js" defer></script>
  </body>
</html>
